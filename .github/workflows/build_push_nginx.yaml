name: Build and Push Nginx Proxy

on:
  push:
    branches:
      - main
    paths:
      - 'nginx_proxy/**'
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_URL_NGINX }}

      - name: Build and Push Nginx Proxy Container
        run: |
          cd nginx_proxy
          docker build -t ${{ secrets.AWS_ECR_URL_NGINX }}:${{ github.sha }} -t ${{ secrets.AWS_ECR_URL_NGINX }}:latest .
          docker push ${{ secrets.AWS_ECR_URL_NGINX }}:${{ github.sha }}
          docker push ${{ secrets.AWS_ECR_URL_NGINX }}:latest

