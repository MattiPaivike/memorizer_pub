name: Build and Push Consumer Service

on:
  push:
    branches:
      - main
    paths:
      - 'consumer_service/**'
      - 'Dockerfile_consumer_service'
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_URL_CONSUMER_SERVICE }}

      - name: Build and Push Consumer Service Container
        run: |
          docker build -t ${{ secrets.AWS_ECR_URL_CONSUMER_SERVICE }}:${{ github.sha }} -t ${{ secrets.AWS_ECR_URL_CONSUMER_SERVICE }}:latest -f ./Dockerfile_consumer_service .
          docker push ${{ secrets.AWS_ECR_URL_CONSUMER_SERVICE }}:${{ github.sha }}
          docker push ${{ secrets.AWS_ECR_URL_CONSUMER_SERVICE }}:latest
